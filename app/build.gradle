// --- Fork build helper (白い熊 考直) ---
// Build the de-Googled FOSS release (fdroidFullRelease), copy the arm64-v8a split APK to ~/tmp
// renamed to shiroikuma-kojiki_<version>_arm64-v8a.apk, then bump BUILD_NUMBER for the next build.
// See the build-apk skill. Config cache is enabled, so everything that touches project/layout/System
// is captured at configuration time; doLast only uses those captured locals + plain file IO.
tasks.register('buildFoss') {
    description = 'Build the fdroidFull release APK, copy arm64-v8a to ~/tmp, and bump BUILD_NUMBER.'
    group = 'build'
    dependsOn 'assembleFdroidFullRelease'

    def apkName = "shiroikuma-kojiki_${forkVersionName}_arm64-v8a.apk".toString()
    def outputDir = layout.buildDirectory.dir('outputs/apk/fdroidFull/release').get().asFile
    def targetDir = new File(System.getProperty('user.home'), 'tmp')
    def propsFile = rootProject.file('gradle.properties')
    def currentBuildNumber = project.property('BUILD_NUMBER').toString().toInteger()
    def fvc = forkVersionCode
    // arm64-v8a installed code = upstream per-ABI multiplier (3) * 10000000 + forkVersionCode.
    def arm64Code = 3 * 10000000 + forkVersionCode

    doLast {
        def srcApk = outputDir.listFiles()?.find {
            it.name.contains('arm64-v8a') && it.name.endsWith('.apk')
        }
        if (srcApk == null) {
            throw new GradleException("No arm64-v8a APK found in ${outputDir}")
        }
        targetDir.mkdirs()
        def targetFile = new File(targetDir, apkName)
        java.nio.file.Files.copy(
            srcApk.toPath(), targetFile.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        println("[1;36m>>> ${targetFile.absolutePath}[0m")
        println("[1;36m>>> versionCode ${arm64Code} (arm64-v8a; forkVersionCode ${fvc})[0m")

        // Auto-increment BUILD_NUMBER for the next build.
        def nextBuildNumber = currentBuildNumber + 1
        propsFile.text = propsFile.text.replace(
            "BUILD_NUMBER=${currentBuildNumber}".toString(),
            "BUILD_NUMBER=${nextBuildNumber}".toString()
        )
        println("[1;36m>>> BUILD_NUMBER bumped to ${nextBuildNumber}[0m")
    }
}
