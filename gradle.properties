# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# codeql needs more for the kotlin compiler
kotlin.daemon.jvmargs=-Xmx3g
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Enable configuration cache
org.gradle.unsafe.configuration-cache=true
org.gradle.caching=true
android.nonFinalResIds=true
# --- Fork versioning (白い熊 考直 — ShiroiKuma0/shiroikuma-kojiki) ---
# VERSION_NAME / VERSION_CODE track the upstream release tag (celzero/rethink-app).
# BUILD_NUMBER is our fork increment: +1 per build with changes, reset to 1 per new upstream.
#   Stored here as a plain integer; it is zero-padded to three digits in the versionName / APK name.
# UPSTREAM_AHEAD = commits our base (main) sits past the nearest published tag v<VERSION_NAME>
#   (`git rev-list --count v<VERSION_NAME>..main`). It keeps the name honest if we ever track main
#   past the tag; tracking the exact tag (the default) makes it 0 and the "-N" suffix drops.
#   Recomputed at rebase time (upstream-new-version skill).
# Fork versionName = "<VERSION_NAME>-<UPSTREAM_AHEAD>+<NNN>" (the "-N" is dropped when 0, <NNN> =
#   BUILD_NUMBER zero-padded to 3 digits, e.g. 0.5.6+003, so builds sort by name);
# Fork versionCode = VERSION_CODE*10000 + BUILD_NUMBER (UPSTREAM_AHEAD does not affect the code).
VERSION_NAME=0.5.7
VERSION_CODE=69
UPSTREAM_AHEAD=0
BUILD_NUMBER=4
# Installed package id for our fork (kept distinct so it coexists with upstream Rethink).
APP_ID=shiroikuma.kojiki
# Code namespace stays on the upstream package so R/BuildConfig, sources, and intent strings are unchanged.
APP_NAMESPACE=com.celzero.bravedns
# option to download firestack version, options: github, jitpack, ossrh, local
# local = fork (白い熊 考直) self-built patched engine, read from app/libs/tun2socks.aar
# (gitignored) via flatDir -- built with `make intra` from ~/git/firestack, branch
# kojiki-doh-idle-057 = celzero's origin/n2 at c4a33649be (EXACTLY the v0.5.7 pin below, so the
# engine matches the tag) + TWO fork patches, both of which cherry-picked clean onto it:
#   * the DoH idle-pool fix (celzero/firestack#241) -- upstream STILL adopts only half of it at
#     c4a33649be (IdleConnTimeout 30s, which sits exactly on Quad9's measured <=30s idle window)
#     and still ships NO h2 PING eviction, so a half-dead conn is found only by losing a query;
#     ours is 10s + http2 ReadIdleTimeout/PingTimeout on top.
#   * the ALG stale-mapping fix (celzero/firestack#252) -- an aged-out alg mapping is recovered
#     by re-resolving instead of dropping the flow invisibly.
# Re-check both on every rebase; drop ours if upstream ever ships the PING eviction too.
# NOTE: firestack needs Go 1.27 from this pin on (~/goroot/go1.27.1; the Makefile forces
# GOTOOLCHAIN=local, so the toolchain must be installed, not auto-fetched). `rm -rf build`
# before `make intra` so the Go-runtime overlay regenerates for the current toolchain.
# firestackCommit is INERT while firestackRepo=local -- it records the AAR's upstream base,
# it does not describe the AAR.
# To return to the stock v0.5.7 engine: firestackRepo=ossrh (this loses BOTH fork patches -- the
# h2-ping half of the DoH fix, so the all-day DNS wedge may return (see KojikiDnsWatchdog), and
# the ALG recovery, so aged-out mappings drop flows with no log row).
firestackRepo=local
firestackCommit=c4a33649be

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
